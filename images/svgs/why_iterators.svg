<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#E53935"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#43A047"/>
    </marker>
    <marker id="arp" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7B1FA2"/>
    </marker>
    <marker id="ar1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#EF9A9A"/>
    </marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#E57373"/>
    </marker>
    <marker id="ar3" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#E53935"/>
    </marker>
    <marker id="ary" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#90A4AE"/>
    </marker>
  </defs>

  <rect width="960" height="380" fill="white"/>

  <!-- ================================================================ -->
  <!-- MAIN TITLE                                                       -->
  <!-- ================================================================ -->
  <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#212121">Why Linked Lists Need Iterators</text>
  <line x1="40" y1="46" x2="920" y2="46" stroke="#E0E0E0"/>

  <!-- Vertical divider between panels -->
  <line x1="480" y1="54" x2="480" y2="365" stroke="#E0E0E0" stroke-dasharray="6,4"/>

  <!-- ================================================================ -->
  <!-- LEFT PANEL: Without Iterators — get(i)                           -->
  <!-- ================================================================ -->
  <text x="240" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#C62828">Without Iterators: get(i)</text>

  <rect x="50" y="80" width="380" height="38" rx="4" fill="#FFEBEE"/>
  <text x="240" y="96" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#B71C1C">for (i = 0; i &lt; n; ++i) cout &lt;&lt; list.get(i);</text>
  <text x="240" y="112" text-anchor="middle" font-size="10" fill="#C62828" font-style="italic">Each get(i) walks from head — O(n) per call</text>

  <!-- head_ label -->
  <text x="112" y="128" text-anchor="middle" font-size="10" font-weight="bold" fill="#7B1FA2">head_</text>
  <line x1="112" y1="131" x2="112" y2="144" stroke="#7B1FA2" stroke-width="1.5" marker-end="url(#arp)"/>

  <!-- Left nodes: 10 -> 20 -> 30 -> 40 -> nullptr -->
  <rect x="92" y="148" width="40" height="24" rx="4" fill="#43A047"/>
  <text x="112" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="white">10</text>
  <line x1="132" y1="160" x2="150" y2="160" stroke="#E53935" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="155" y="148" width="40" height="24" rx="4" fill="#1E88E5"/>
  <text x="175" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="white">20</text>
  <line x1="195" y1="160" x2="213" y2="160" stroke="#E53935" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="218" y="148" width="40" height="24" rx="4" fill="#43A047"/>
  <text x="238" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="white">30</text>
  <line x1="258" y1="160" x2="276" y2="160" stroke="#E53935" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="281" y="148" width="40" height="24" rx="4" fill="#1E88E5"/>
  <text x="301" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="white">40</text>
  <line x1="321" y1="160" x2="339" y2="160" stroke="#E53935" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="344" y="151" width="48" height="18" rx="3" fill="#ECEFF1" stroke="#BDBDBD" stroke-width="0.5"/>
  <text x="368" y="164" text-anchor="middle" font-size="9" fill="#546E7A">nullptr</text>

  <!-- get(i) arrows — all start from head (x=112), getting progressively longer -->
  <text x="55" y="197" font-size="10" font-family="Consolas, monospace" fill="#EF9A9A">get(0)</text>
  <circle cx="112" cy="194" r="4" fill="#FFCDD2" stroke="#EF9A9A"/>
  <text x="395" y="197" text-anchor="end" font-size="9" fill="#EF9A9A">1 step</text>

  <text x="55" y="217" font-size="10" font-family="Consolas, monospace" fill="#E57373">get(1)</text>
  <line x1="112" y1="214" x2="168" y2="214" stroke="#EF9A9A" stroke-width="2" marker-end="url(#ar1)"/>
  <text x="395" y="217" text-anchor="end" font-size="9" fill="#E57373">2 steps</text>

  <text x="55" y="237" font-size="10" font-family="Consolas, monospace" fill="#E57373">get(2)</text>
  <line x1="112" y1="234" x2="231" y2="234" stroke="#E57373" stroke-width="2" marker-end="url(#ar2)"/>
  <text x="395" y="237" text-anchor="end" font-size="9" fill="#E57373">3 steps</text>

  <text x="55" y="257" font-size="10" font-family="Consolas, monospace" fill="#E53935">get(3)</text>
  <line x1="112" y1="254" x2="294" y2="254" stroke="#E53935" stroke-width="2.5" marker-end="url(#ar3)"/>
  <text x="395" y="257" text-anchor="end" font-size="9" fill="#E53935">4 steps</text>

  <!-- Left result box -->
  <rect x="50" y="275" width="380" height="36" rx="5" fill="#FFCDD2"/>
  <text x="240" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#B71C1C">Total: 1 + 2 + 3 + 4 = 10 steps &#x2192; O(n&#xB2;)</text>
  <text x="240" y="304" text-anchor="middle" font-size="10" fill="#C62828">Every call restarts from head_</text>

  <!-- ================================================================ -->
  <!-- RIGHT PANEL: With Iterator — ++it                                -->
  <!-- ================================================================ -->
  <text x="710" y="70" text-anchor="middle" font-size="15" font-weight="bold" fill="#2E7D32">With Iterator: ++it</text>

  <rect x="520" y="80" width="380" height="38" rx="4" fill="#E8F5E9"/>
  <text x="710" y="96" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#1B5E20">for (int val : list) cout &lt;&lt; val;</text>
  <text x="710" y="112" text-anchor="middle" font-size="10" fill="#2E7D32" font-style="italic">Iterator advances one step — O(1) per step</text>

  <!-- current_ label -->
  <text x="572" y="128" text-anchor="middle" font-size="10" font-weight="bold" fill="#7B1FA2">current_</text>
  <line x1="572" y1="131" x2="572" y2="144" stroke="#7B1FA2" stroke-width="1.5" marker-end="url(#arp)"/>

  <!-- Right nodes: 10 -> 20 -> 30 -> 40 -> nullptr -->
  <rect x="552" y="148" width="40" height="24" rx="4" fill="#43A047"/>
  <text x="572" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="white">10</text>
  <line x1="592" y1="160" x2="610" y2="160" stroke="#E53935" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="615" y="148" width="40" height="24" rx="4" fill="#1E88E5"/>
  <text x="635" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="white">20</text>
  <line x1="655" y1="160" x2="673" y2="160" stroke="#E53935" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="678" y="148" width="40" height="24" rx="4" fill="#43A047"/>
  <text x="698" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="white">30</text>
  <line x1="718" y1="160" x2="736" y2="160" stroke="#E53935" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="741" y="148" width="40" height="24" rx="4" fill="#1E88E5"/>
  <text x="761" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="white">40</text>
  <line x1="781" y1="160" x2="799" y2="160" stroke="#E53935" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="804" y="151" width="48" height="18" rx="3" fill="#ECEFF1" stroke="#BDBDBD" stroke-width="0.5"/>
  <text x="828" y="164" text-anchor="middle" font-size="9" fill="#546E7A">nullptr</text>

  <!-- Iterator step arrows — each is one short hop between adjacent nodes -->
  <text x="520" y="197" font-size="10" font-family="Consolas, monospace" fill="#43A047">++it</text>
  <line x1="572" y1="194" x2="628" y2="194" stroke="#43A047" stroke-width="2" marker-end="url(#arg)"/>
  <text x="870" y="197" text-anchor="end" font-size="9" fill="#2E7D32">1 step</text>

  <text x="520" y="217" font-size="10" font-family="Consolas, monospace" fill="#43A047">++it</text>
  <line x1="635" y1="214" x2="691" y2="214" stroke="#43A047" stroke-width="2" marker-end="url(#arg)"/>
  <text x="870" y="217" text-anchor="end" font-size="9" fill="#2E7D32">1 step</text>

  <text x="520" y="237" font-size="10" font-family="Consolas, monospace" fill="#43A047">++it</text>
  <line x1="698" y1="234" x2="754" y2="234" stroke="#43A047" stroke-width="2" marker-end="url(#arg)"/>
  <text x="870" y="237" text-anchor="end" font-size="9" fill="#2E7D32">1 step</text>

  <text x="520" y="257" font-size="10" font-family="Consolas, monospace" fill="#90A4AE">++it</text>
  <line x1="761" y1="254" x2="820" y2="254" stroke="#90A4AE" stroke-width="2" marker-end="url(#ary)"/>
  <text x="870" y="257" text-anchor="end" font-size="9" fill="#90A4AE">stop</text>

  <!-- Right result box -->
  <rect x="520" y="275" width="380" height="36" rx="5" fill="#C8E6C9"/>
  <text x="710" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#1B5E20">Total: 1 + 1 + 1 + 1 = 4 steps &#x2192; O(n)</text>
  <text x="710" y="304" text-anchor="middle" font-size="10" fill="#2E7D32">Never restarts — remembers position</text>

  <!-- Comparison bar -->
  <rect x="160" y="322" width="640" height="36" rx="8" fill="#FFF9C4" stroke="#F9A825" stroke-width="1.5"/>
  <text x="480" y="338" text-anchor="middle" font-size="14" font-weight="bold" fill="#E65100">get(i) loop: O(n&#xB2;)   vs   Iterator loop: O(n)</text>
  <text x="480" y="353" text-anchor="middle" font-size="11" fill="#F57F17">Iterators remember where you are — no re-traversal</text>
</svg>
