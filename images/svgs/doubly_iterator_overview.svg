<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#E53935"/>
    </marker>
    <marker id="arb" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1E88E5"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#43A047"/>
    </marker>
    <marker id="aro" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#FB8C00"/>
    </marker>
    <marker id="arp" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7B1FA2"/>
    </marker>
    <marker id="ary" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#90A4AE"/>
    </marker>
  </defs>

  <rect width="960" height="400" fill="white"/>

  <!-- ================================================================ -->
  <!-- TITLE                                                            -->
  <!-- ================================================================ -->
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#212121">DoublyLinkedList Iterator: Six Pieces</text>
  <text x="480" y="50" text-anchor="middle" font-size="12" fill="#757575">Reuses the five singly linked list pieces, plus operator-- for reverse traversal</text>

  <!-- ================================================================ -->
  <!-- DOUBLY LINKED LIST NODES (4 nodes, wide spacing)                 -->
  <!-- ================================================================ -->

  <!-- head_ label -->
  <text x="230" y="68" text-anchor="middle" font-size="10" font-weight="bold" fill="#7B1FA2">head_</text>
  <line x1="230" y1="71" x2="230" y2="82" stroke="#7B1FA2" stroke-width="1.5" marker-end="url(#arp)"/>

  <!-- tail_ label -->
  <text x="730" y="68" text-anchor="middle" font-size="10" font-weight="bold" fill="#7B1FA2">tail_</text>
  <line x1="730" y1="71" x2="730" y2="82" stroke="#7B1FA2" stroke-width="1.5" marker-end="url(#arp)"/>

  <!-- nullptr left -->
  <rect x="110" y="94" width="48" height="18" rx="3" fill="#ECEFF1" stroke="#BDBDBD" stroke-width="0.5"/>
  <text x="134" y="107" text-anchor="middle" font-size="9" fill="#546E7A">nullptr</text>

  <!-- Node 10 -->
  <rect x="210" y="88" width="40" height="30" rx="4" fill="#43A047"/>
  <text x="230" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="white">10</text>
  <!-- next arrow (top) -->
  <line x1="250" y1="95" x2="373" y2="95" stroke="#E53935" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- prev arrow (bottom) -->
  <line x1="210" y1="111" x2="165" y2="111" stroke="#1E88E5" stroke-width="1.5" marker-end="url(#arb)"/>

  <!-- Node 20 -->
  <rect x="380" y="88" width="40" height="30" rx="4" fill="#1E88E5"/>
  <text x="400" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="white">20</text>
  <line x1="420" y1="95" x2="543" y2="95" stroke="#E53935" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="380" y1="111" x2="257" y2="111" stroke="#1E88E5" stroke-width="1.5" marker-end="url(#arb)"/>

  <!-- Node 30 -->
  <rect x="550" y="88" width="40" height="30" rx="4" fill="#43A047"/>
  <text x="570" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="white">30</text>
  <line x1="590" y1="95" x2="703" y2="95" stroke="#E53935" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="550" y1="111" x2="427" y2="111" stroke="#1E88E5" stroke-width="1.5" marker-end="url(#arb)"/>

  <!-- Node 40 -->
  <rect x="710" y="88" width="40" height="30" rx="4" fill="#1E88E5"/>
  <text x="730" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="white">40</text>
  <line x1="750" y1="95" x2="793" y2="95" stroke="#E53935" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="710" y1="111" x2="597" y2="111" stroke="#1E88E5" stroke-width="1.5" marker-end="url(#arb)"/>

  <!-- nullptr right -->
  <rect x="800" y="94" width="48" height="18" rx="3" fill="#ECEFF1" stroke="#BDBDBD" stroke-width="0.5"/>
  <text x="824" y="107" text-anchor="middle" font-size="9" fill="#546E7A">nullptr</text>

  <!-- Arrow legend -->
  <text x="480" y="82" text-anchor="middle" font-size="9" fill="#E53935">next &#x2192;</text>
  <text x="480" y="128" text-anchor="middle" font-size="9" fill="#1E88E5">&#x2190; prev</text>

  <!-- ================================================================ -->
  <!-- FORWARD TRAVERSAL                                                -->
  <!-- ================================================================ -->
  <text x="280" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E7D32">Forward: begin() / end() / ++it</text>

  <!-- Dark code block -->
  <rect x="60" y="165" width="440" height="40" rx="5" fill="#263238"/>
  <text x="80" y="188" font-family="Consolas, monospace" font-size="12">
    <tspan fill="#B0BEC5">for (auto it = </tspan><tspan fill="#66BB6A">list.begin()</tspan><tspan fill="#B0BEC5">; it != </tspan><tspan fill="#42A5F5">list.end()</tspan><tspan fill="#B0BEC5">; </tspan><tspan fill="#26A69A">++it</tspan><tspan fill="#B0BEC5">)</tspan>
  </text>

  <!-- Forward arrows showing traversal direction -->
  <line x1="140" y1="218" x2="440" y2="218" stroke="#43A047" stroke-width="2.5" marker-end="url(#arg)"/>
  <text x="290" y="233" text-anchor="middle" font-size="11" fill="#2E7D32">head_ &#x2192; &#x2192; &#x2192; &#x2192; nullptr</text>

  <rect x="60" y="243" width="440" height="28" rx="5" fill="#E8F5E9"/>
  <text x="280" y="261" text-anchor="middle" font-size="11" fill="#1B5E20">begin() = Iterator{head_}    end() = Iterator{nullptr}    ++it advances via next</text>

  <!-- ================================================================ -->
  <!-- REVERSE TRAVERSAL                                                -->
  <!-- ================================================================ -->
  <text x="700" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#E65100">Reverse: rbegin() / rend() / --it</text>

  <!-- Dark code block -->
  <rect x="500" y="165" width="420" height="40" rx="5" fill="#263238"/>
  <text x="520" y="188" font-family="Consolas, monospace" font-size="12">
    <tspan fill="#B0BEC5">for (auto it = </tspan><tspan fill="#FFA726">list.rbegin()</tspan><tspan fill="#B0BEC5">; it != </tspan><tspan fill="#FFA726">list.rend()</tspan><tspan fill="#B0BEC5">; </tspan><tspan fill="#FB8C00">--it</tspan><tspan fill="#B0BEC5">)</tspan>
  </text>

  <!-- Reverse arrows showing traversal direction -->
  <line x1="820" y1="218" x2="520" y2="218" stroke="#FB8C00" stroke-width="2.5" marker-end="url(#aro)"/>
  <text x="670" y="233" text-anchor="middle" font-size="11" fill="#E65100">tail_ &#x2190; &#x2190; &#x2190; &#x2190; nullptr</text>

  <rect x="500" y="243" width="420" height="28" rx="5" fill="#FFF3E0"/>
  <text x="710" y="261" text-anchor="middle" font-size="11" fill="#BF360C">rbegin() = Iterator{tail_}    rend() = Iterator{nullptr}    --it retreats via prev</text>

  <!-- ================================================================ -->
  <!-- SIX CARDS                                                        -->
  <!-- ================================================================ -->

  <!-- Card 1: begin() — GREEN -->
  <rect x="31" y="286" width="142" height="72" rx="5" fill="white" stroke="#E0E0E0"/>
  <rect x="32" y="287" width="140" height="3" rx="2" fill="#43A047"/>
  <circle cx="47" cy="305" r="8" fill="#43A047"/>
  <text x="47" y="309" text-anchor="middle" font-size="9" font-weight="bold" fill="white">1</text>
  <text x="60" y="309" font-size="11" font-weight="bold" fill="#2E7D32">begin()</text>
  <text x="39" y="325" font-family="Consolas, monospace" font-size="9" fill="#43A047">Iterator{head_}</text>
  <text x="39" y="340" font-size="9" fill="#424242">Start at first node</text>
  <text x="39" y="352" font-size="9" fill="#757575">(same as SLL)</text>

  <!-- Card 2: end() — BLUE -->
  <rect x="183" y="286" width="142" height="72" rx="5" fill="white" stroke="#E0E0E0"/>
  <rect x="184" y="287" width="140" height="3" rx="2" fill="#1E88E5"/>
  <circle cx="199" cy="305" r="8" fill="#1E88E5"/>
  <text x="199" y="309" text-anchor="middle" font-size="9" font-weight="bold" fill="white">2</text>
  <text x="212" y="309" font-size="11" font-weight="bold" fill="#1565C0">end()</text>
  <text x="191" y="325" font-family="Consolas, monospace" font-size="9" fill="#1E88E5">Iterator{nullptr}</text>
  <text x="191" y="340" font-size="9" fill="#424242">Sentinel past last node</text>
  <text x="191" y="352" font-size="9" fill="#757575">(same as SLL)</text>

  <!-- Card 3: operator!= — ORANGE -->
  <rect x="335" y="286" width="142" height="72" rx="5" fill="white" stroke="#E0E0E0"/>
  <rect x="336" y="287" width="140" height="3" rx="2" fill="#FB8C00"/>
  <circle cx="351" cy="305" r="8" fill="#FB8C00"/>
  <text x="351" y="309" text-anchor="middle" font-size="9" font-weight="bold" fill="white">3</text>
  <text x="364" y="309" font-size="11" font-weight="bold" fill="#E65100">operator!=</text>
  <text x="343" y="325" font-family="Consolas, monospace" font-size="9" fill="#FB8C00">current_ != other</text>
  <text x="343" y="340" font-size="9" fill="#424242">Compare addresses</text>
  <text x="343" y="352" font-size="9" fill="#757575">(same as SLL)</text>

  <!-- Card 4: operator* — PURPLE -->
  <rect x="487" y="286" width="142" height="72" rx="5" fill="white" stroke="#E0E0E0"/>
  <rect x="488" y="287" width="140" height="3" rx="2" fill="#8E24AA"/>
  <circle cx="503" cy="305" r="8" fill="#8E24AA"/>
  <text x="503" y="309" text-anchor="middle" font-size="9" font-weight="bold" fill="white">4</text>
  <text x="516" y="309" font-size="11" font-weight="bold" fill="#6A1B9A">operator*</text>
  <text x="495" y="325" font-family="Consolas, monospace" font-size="9" fill="#8E24AA">current_-&gt;data</text>
  <text x="495" y="340" font-size="9" fill="#424242">Read/write node value</text>
  <text x="495" y="352" font-size="9" fill="#757575">(same as SLL)</text>

  <!-- Card 5: operator++ — TEAL -->
  <rect x="639" y="286" width="142" height="72" rx="5" fill="white" stroke="#E0E0E0"/>
  <rect x="640" y="287" width="140" height="3" rx="2" fill="#00897B"/>
  <circle cx="655" cy="305" r="8" fill="#00897B"/>
  <text x="655" y="309" text-anchor="middle" font-size="9" font-weight="bold" fill="white">5</text>
  <text x="668" y="309" font-size="11" font-weight="bold" fill="#00695C">operator++</text>
  <text x="647" y="325" font-family="Consolas, monospace" font-size="9" fill="#00897B">current_ = -&gt;next</text>
  <text x="647" y="340" font-size="9" fill="#424242">Advance forward</text>
  <text x="647" y="352" font-size="9" fill="#757575">(same as SLL)</text>

  <!-- Card 6: operator decrement, RED/NEW -->
  <rect x="791" y="286" width="142" height="72" rx="5" fill="#FFF3E0" stroke="#FB8C00"/>
  <rect x="792" y="287" width="140" height="3" rx="2" fill="#E53935"/>
  <circle cx="807" cy="305" r="8" fill="#E53935"/>
  <text x="807" y="309" text-anchor="middle" font-size="9" font-weight="bold" fill="white">6</text>
  <text x="820" y="309" font-size="11" font-weight="bold" fill="#C62828">operator--</text>
  <text x="799" y="325" font-family="Consolas, monospace" font-size="9" fill="#E53935">current_ = -&gt;prev</text>
  <text x="799" y="340" font-size="9" fill="#424242">Retreat backward</text>
  <text x="799" y="352" font-size="9" font-weight="bold" fill="#E65100">NEW — DLL only</text>

  <!-- Bottom note -->
  <text x="480" y="384" text-anchor="middle" font-size="11" fill="#757575" font-style="italic">Five pieces reused from SinglyLinkedList + one new operator for reverse traversal via prev pointers.</text>
</svg>
