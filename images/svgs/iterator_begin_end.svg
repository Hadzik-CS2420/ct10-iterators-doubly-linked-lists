<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="100%" height="100%" fill="white"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="ptr-arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8e44ad"/>
    </marker>
    <marker id="iter-arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2980b9"/>
    </marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-size="18px" font-weight="bold" fill="#1a1a1a">begin() and end(): Where Iteration Starts and Stops</text>

  <!-- ==================== The list ==================== -->
  <text x="30" y="65" font-size="14px" font-weight="bold" fill="#333">List: 10 &#x2192; 20 &#x2192; 30 &#x2192; nullptr</text>

  <!-- head_ pointer -->
  <text x="147" y="88" text-anchor="middle" font-size="12px" font-weight="bold" fill="#8e44ad">head_</text>
  <line x1="147" y1="93" x2="147" y2="113" stroke="#8e44ad" stroke-width="2" marker-end="url(#ptr-arrow)"/>

  <!-- Node 10 -->
  <rect x="120" y="115" width="55" height="40" rx="4" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <rect x="175" y="115" width="55" height="40" rx="4" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="147" y="140" text-anchor="middle" font-size="15px" font-weight="bold" fill="#fff">10</text>
  <text x="202" y="140" text-anchor="middle" font-size="11px" font-weight="bold" fill="#fff">next</text>

  <!-- Arrow 10→20 -->
  <line x1="230" y1="135" x2="318" y2="135" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 20 -->
  <rect x="320" y="115" width="55" height="40" rx="4" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <rect x="375" y="115" width="55" height="40" rx="4" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="347" y="140" text-anchor="middle" font-size="15px" font-weight="bold" fill="#fff">20</text>
  <text x="402" y="140" text-anchor="middle" font-size="11px" font-weight="bold" fill="#fff">next</text>

  <!-- Arrow 20→30 -->
  <line x1="430" y1="135" x2="518" y2="135" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node 30 -->
  <rect x="520" y="115" width="55" height="40" rx="4" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <rect x="575" y="115" width="55" height="40" rx="4" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="547" y="140" text-anchor="middle" font-size="15px" font-weight="bold" fill="#fff">30</text>
  <text x="602" y="140" text-anchor="middle" font-size="11px" font-weight="bold" fill="#fff">next</text>

  <!-- Arrow 30→nullptr -->
  <line x1="630" y1="135" x2="688" y2="135" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="690" y="125" width="65" height="22" rx="4" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.5"/>
  <text x="722" y="141" text-anchor="middle" font-size="12px" font-weight="bold" fill="#e74c3c">nullptr</text>

  <!-- ==================== begin() ==================== -->
  <!-- begin() iterator box — positioned right below the list -->
  <rect x="115" y="180" width="120" height="30" rx="6" fill="#2980b9" stroke="#2471a3" stroke-width="2"/>
  <text x="175" y="200" text-anchor="middle" font-size="15px" font-weight="bold" fill="#fff" style="font-size: 13px;">begin()</text>

  <!-- Dashed arrow from begin() up to Node 10 -->
  <line x1="155" y1="180" x2="147" y2="158" stroke="#2980b9" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#iter-arrow)"/>

  <text x="30" y="240" font-size="14px" font-weight="bold" fill="#333">begin() returns Iterator{head_} &#x2014; points to the first node</text>
  <text x="30" y="257" font-size="12px" fill="#2c3e50" font-family="'Consolas', monospace">Iterator begin() { return Iterator{head_}; }</text>

  <!-- ==================== end() ==================== -->
  <!-- end() iterator box — positioned right below the list -->
  <rect x="660" y="180" width="100" height="30" rx="6" fill="#2980b9" stroke="#2471a3" stroke-width="2"/>
  <text x="710" y="200" text-anchor="middle" font-size="15px" font-weight="bold" fill="#fff" style="font-size: 13px;">end()</text>
  <text x="710" y="225" text-anchor="middle" font-size="11px" fill="#777" font-style="italic">(sentinel)</text>

  <!-- Dashed arrow from end() up to nullptr -->
  <line x1="700" y1="180" x2="722" y2="150" stroke="#2980b9" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#iter-arrow)"/>

  <text x="30" y="290" font-size="14px" font-weight="bold" fill="#333">end() returns Iterator{nullptr} &#x2014; one past the last node</text>
  <text x="30" y="307" font-size="12px" fill="#2c3e50" font-family="'Consolas', monospace">Iterator end() { return Iterator{nullptr}; }</text>

  <!-- ==================== Note ==================== -->
  <text x="400" y="332" text-anchor="middle" font-size="11px" fill="#777" font-style="italic">The loop runs while (it != end()) &#x2014; it stops when current_ reaches nullptr.</text>
</svg>
