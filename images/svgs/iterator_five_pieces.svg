<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="960" height="270" fill="white"/>

  <!-- ================================================================ -->
  <!-- TITLE                                                            -->
  <!-- ================================================================ -->
  <text x="480" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#212121">The Five Iterator Pieces</text>
  <text x="480" y="48" text-anchor="middle" font-size="12" fill="#757575">The compiler rewrites range-based for into this explicit form:</text>

  <!-- Dark code block with colored syntax -->
  <rect x="120" y="60" width="720" height="50" rx="6" fill="#263238"/>
  <text x="140" y="82" font-family="Consolas, monospace" font-size="13">
    <tspan fill="#B0BEC5">for (auto it = </tspan><tspan fill="#66BB6A">list.begin()</tspan><tspan fill="#B0BEC5">; </tspan><tspan fill="#FFA726">it != </tspan><tspan fill="#42A5F5">list.end()</tspan><tspan fill="#B0BEC5">; </tspan><tspan fill="#26A69A">++it</tspan><tspan fill="#B0BEC5">)</tspan>
  </text>
  <text x="140" y="100" font-family="Consolas, monospace" font-size="13">
    <tspan fill="#B0BEC5">    std::cout &lt;&lt; </tspan><tspan fill="#AB47BC">*it</tspan><tspan fill="#B0BEC5">;</tspan>
  </text>

  <!-- ================================================================ -->
  <!-- FIVE CARDS                                                       -->
  <!-- ================================================================ -->

  <!-- Card 1: begin() — GREEN -->
  <rect x="31" y="126" width="170" height="92" rx="6" fill="white" stroke="#E0E0E0"/>
  <rect x="32" y="127" width="168" height="4" rx="3" fill="#43A047"/>
  <circle cx="51" cy="148" r="10" fill="#43A047"/>
  <text x="51" y="152" text-anchor="middle" font-size="10" font-weight="bold" fill="white">1</text>
  <text x="67" y="152" font-size="13" font-weight="bold" fill="#2E7D32">begin()</text>
  <text x="41" y="170" font-family="Consolas, monospace" font-size="10" fill="#43A047">Iterator{head_}</text>
  <text x="41" y="188" font-size="10" fill="#424242">Start at first node. If list</text>
  <text x="41" y="201" font-size="10" fill="#424242">is empty, equals end() so</text>
  <text x="41" y="214" font-size="10" fill="#424242">the loop body never runs.</text>

  <!-- Card 2: end() — BLUE -->
  <rect x="213" y="126" width="170" height="92" rx="6" fill="white" stroke="#E0E0E0"/>
  <rect x="214" y="127" width="168" height="4" rx="3" fill="#1E88E5"/>
  <circle cx="233" cy="148" r="10" fill="#1E88E5"/>
  <text x="233" y="152" text-anchor="middle" font-size="10" font-weight="bold" fill="white">2</text>
  <text x="249" y="152" font-size="13" font-weight="bold" fill="#1565C0">end()</text>
  <text x="223" y="170" font-family="Consolas, monospace" font-size="10" fill="#1E88E5">Iterator{nullptr}</text>
  <text x="223" y="188" font-size="10" fill="#424242">Sentinel — one past the last</text>
  <text x="223" y="201" font-size="10" fill="#424242">node. Loop stops when</text>
  <text x="223" y="214" font-size="10" fill="#424242">current_ reaches nullptr.</text>

  <!-- Card 3: operator!= — ORANGE -->
  <rect x="395" y="126" width="170" height="92" rx="6" fill="white" stroke="#E0E0E0"/>
  <rect x="396" y="127" width="168" height="4" rx="3" fill="#FB8C00"/>
  <circle cx="415" cy="148" r="10" fill="#FB8C00"/>
  <text x="415" y="152" text-anchor="middle" font-size="10" font-weight="bold" fill="white">3</text>
  <text x="431" y="152" font-size="13" font-weight="bold" fill="#E65100">operator!=</text>
  <text x="405" y="170" font-family="Consolas, monospace" font-size="10" fill="#FB8C00">it != list.end()</text>
  <text x="405" y="188" font-size="10" fill="#424242">Compares two iterator</text>
  <text x="405" y="201" font-size="10" fill="#424242">addresses. Loop continues</text>
  <text x="405" y="214" font-size="10" fill="#424242">while not at end sentinel.</text>

  <!-- Card 4: operator* — PURPLE -->
  <rect x="577" y="126" width="170" height="92" rx="6" fill="white" stroke="#E0E0E0"/>
  <rect x="578" y="127" width="168" height="4" rx="3" fill="#8E24AA"/>
  <circle cx="597" cy="148" r="10" fill="#8E24AA"/>
  <text x="597" y="152" text-anchor="middle" font-size="10" font-weight="bold" fill="white">4</text>
  <text x="613" y="152" font-size="13" font-weight="bold" fill="#6A1B9A">operator*</text>
  <text x="587" y="170" font-family="Consolas, monospace" font-size="10" fill="#8E24AA">current_-&gt;data</text>
  <text x="587" y="188" font-size="10" fill="#424242">Dereferences to read the</text>
  <text x="587" y="201" font-size="10" fill="#424242">value. Returns int&amp; so</text>
  <text x="587" y="214" font-size="10" fill="#424242">changes go through.</text>

  <!-- Card 5: operator++ — TEAL -->
  <rect x="759" y="126" width="170" height="92" rx="6" fill="white" stroke="#E0E0E0"/>
  <rect x="760" y="127" width="168" height="4" rx="3" fill="#00897B"/>
  <circle cx="779" cy="148" r="10" fill="#00897B"/>
  <text x="779" y="152" text-anchor="middle" font-size="10" font-weight="bold" fill="white">5</text>
  <text x="795" y="152" font-size="13" font-weight="bold" fill="#00695C">operator++</text>
  <text x="769" y="170" font-family="Consolas, monospace" font-size="10" fill="#00897B">current_ = -&gt;next</text>
  <text x="769" y="188" font-size="10" fill="#424242">Advance one node forward.</text>
  <text x="769" y="201" font-size="10" fill="#424242">O(1) — just follow one</text>
  <text x="769" y="214" font-size="10" fill="#424242">pointer. Never restarts.</text>

  <!-- Bottom note -->
  <text x="480" y="248" text-anchor="middle" font-size="11" fill="#757575" font-style="italic">Once these five members exist, range-based for works automatically — same syntax as std::vector.</text>
</svg>
