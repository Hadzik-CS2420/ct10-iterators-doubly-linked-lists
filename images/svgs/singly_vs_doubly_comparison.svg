<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 495">
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .title      { font-size: 18px; font-weight: bold; fill: #1a1a1a; }
    .section    { font-size: 12px; font-weight: bold; fill: #888; }
    .col-header { font-size: 13px; font-weight: bold; fill: #fff; }
    .op         { font-size: 12px; font-weight: bold; fill: #2c3e50; font-family: 'Consolas', monospace; }
    .badge      { font-size: 11px; font-weight: bold; fill: #fff; }
    .note       { font-size: 11px; fill: #555; }
    .trade-key  { font-size: 12px; font-weight: bold; fill: #2c3e50; }
    .trade-val  { font-size: 11px; fill: #444; }
    .sub        { font-size: 10px; fill: #888; }
  </style>

  <!-- Title -->
  <text x="380" y="26" text-anchor="middle" class="title">Singly vs. Doubly Linked List: Trade-offs</text>

  <!-- ================================================================ -->
  <!-- BIG O TABLE                                                       -->
  <!-- ================================================================ -->

  <text x="20" y="46" class="section">OPERATION COMPLEXITY</text>

  <!-- Header -->
  <rect x="20" y="52" width="718" height="28" rx="3" fill="#2c3e50"/>
  <text x="105" y="71" text-anchor="middle" class="col-header">Operation</text>
  <text x="326" y="71" text-anchor="middle" class="col-header">Singly Linked List</text>
  <text x="599" y="71" text-anchor="middle" class="col-header">Doubly Linked List</text>

  <!-- Row fills -->
  <rect x="20"  y="80"  width="718" height="34" fill="#f8f9fa"/>
  <rect x="20"  y="114" width="718" height="34" fill="white"/>
  <rect x="20"  y="148" width="718" height="34" fill="#f8f9fa"/>
  <rect x="20"  y="182" width="718" height="34" fill="white"/>
  <rect x="20"  y="216" width="718" height="34" fill="#f8f9fa"/>
  <rect x="20"  y="250" width="718" height="34" fill="white"/>

  <!-- Table border + column dividers + row dividers -->
  <rect x="20" y="52" width="718" height="232" rx="3" fill="none" stroke="#dee2e6" stroke-width="1.5"/>
  <line x1="190" y1="52"  x2="190" y2="284" stroke="#dee2e6" stroke-width="1"/>
  <line x1="462" y1="52"  x2="462" y2="284" stroke="#dee2e6" stroke-width="1"/>
  <line x1="20"  y1="80"  x2="738" y2="80"  stroke="#dee2e6" stroke-width="1"/>
  <line x1="20"  y1="114" x2="738" y2="114" stroke="#dee2e6" stroke-width="1"/>
  <line x1="20"  y1="148" x2="738" y2="148" stroke="#dee2e6" stroke-width="1"/>
  <line x1="20"  y1="182" x2="738" y2="182" stroke="#dee2e6" stroke-width="1"/>
  <line x1="20"  y1="216" x2="738" y2="216" stroke="#dee2e6" stroke-width="1"/>
  <line x1="20"  y1="250" x2="738" y2="250" stroke="#dee2e6" stroke-width="1"/>

  <!-- Row 1: push_front -->
  <text x="105" y="101" text-anchor="middle" class="op">push_front()</text>
  <rect x="200" y="88"  width="40" height="18" rx="9" fill="#27ae60"/>
  <text x="220" y="101" text-anchor="middle" class="badge">O(1)</text>
  <text x="248" y="101" class="note">head_ points directly to the front</text>
  <rect x="472" y="88"  width="40" height="18" rx="9" fill="#27ae60"/>
  <text x="492" y="101" text-anchor="middle" class="badge">O(1)</text>
  <text x="520" y="101" class="note">same — head_ points directly to the front</text>

  <!-- Row 2: push_back -->
  <text x="105" y="135" text-anchor="middle" class="op">push_back()</text>
  <rect x="200" y="122" width="40" height="18" rx="9" fill="#c0392b"/>
  <text x="220" y="135" text-anchor="middle" class="badge">O(n)</text>
  <text x="248" y="135" class="note">must walk the entire list to find the tail</text>
  <rect x="472" y="122" width="40" height="18" rx="9" fill="#27ae60"/>
  <text x="492" y="135" text-anchor="middle" class="badge">O(1)</text>
  <text x="520" y="135" class="note">tail_ points directly to the back</text>

  <!-- Row 3: pop_front -->
  <text x="105" y="169" text-anchor="middle" class="op">pop_front()</text>
  <rect x="200" y="156" width="40" height="18" rx="9" fill="#27ae60"/>
  <text x="220" y="169" text-anchor="middle" class="badge">O(1)</text>
  <text x="248" y="169" class="note">head_ points directly to the front</text>
  <rect x="472" y="156" width="40" height="18" rx="9" fill="#27ae60"/>
  <text x="492" y="169" text-anchor="middle" class="badge">O(1)</text>
  <text x="520" y="169" class="note">same — head_ points directly to the front</text>

  <!-- Row 4: pop_back -->
  <text x="105" y="203" text-anchor="middle" class="op">pop_back()</text>
  <rect x="200" y="190" width="40" height="18" rx="9" fill="#c0392b"/>
  <text x="220" y="203" text-anchor="middle" class="badge">O(n)</text>
  <text x="248" y="203" class="note">trailing pointer to find second-to-last</text>
  <rect x="472" y="190" width="40" height="18" rx="9" fill="#27ae60"/>
  <text x="492" y="203" text-anchor="middle" class="badge">O(1)</text>
  <text x="520" y="203" class="note">tail_-&gt;prev reaches second-to-last directly</text>

  <!-- Row 5: contains -->
  <text x="105" y="237" text-anchor="middle" class="op">contains()</text>
  <rect x="200" y="224" width="40" height="18" rx="9" fill="#c0392b"/>
  <text x="220" y="237" text-anchor="middle" class="badge">O(n)</text>
  <text x="248" y="237" class="note">must scan from head to find value</text>
  <rect x="472" y="224" width="40" height="18" rx="9" fill="#c0392b"/>
  <text x="492" y="237" text-anchor="middle" class="badge">O(n)</text>
  <text x="520" y="237" class="note">same — no index, must scan the list</text>

  <!-- Row 6: remove -->
  <text x="105" y="271" text-anchor="middle" class="op">remove()</text>
  <rect x="200" y="258" width="40" height="18" rx="9" fill="#c0392b"/>
  <text x="220" y="271" text-anchor="middle" class="badge">O(n)</text>
  <text x="248" y="271" class="note">trailing pointer to find and unlink node</text>
  <rect x="472" y="258" width="40" height="18" rx="9" fill="#c0392b"/>
  <text x="492" y="271" text-anchor="middle" class="badge">O(n)</text>
  <text x="520" y="271" class="note">same — must still scan to find the value</text>

  <!-- ================================================================ -->
  <!-- TRADE-OFFS TABLE                                                  -->
  <!-- ================================================================ -->

  <text x="20" y="308" class="section">MEMORY &amp; DESIGN TRADE-OFFS</text>

  <!-- Header -->
  <rect x="20" y="314" width="718" height="28" rx="3" fill="#2c3e50"/>
  <text x="105" y="333" text-anchor="middle" class="col-header">Category</text>
  <text x="326" y="333" text-anchor="middle" class="col-header">Singly Linked List</text>
  <text x="599" y="333" text-anchor="middle" class="col-header">Doubly Linked List</text>

  <!-- Row fills -->
  <rect x="20"  y="342" width="718" height="36" fill="#f8f9fa"/>
  <rect x="20"  y="378" width="718" height="36" fill="white"/>
  <rect x="20"  y="414" width="718" height="36" fill="#f8f9fa"/>
  <rect x="20"  y="450" width="718" height="36" fill="white"/>

  <!-- Table border + dividers -->
  <rect x="20" y="314" width="718" height="172" rx="3" fill="none" stroke="#dee2e6" stroke-width="1.5"/>
  <line x1="190" y1="314" x2="190" y2="486" stroke="#dee2e6" stroke-width="1"/>
  <line x1="462" y1="314" x2="462" y2="486" stroke="#dee2e6" stroke-width="1"/>
  <line x1="20"  y1="342" x2="738" y2="342" stroke="#dee2e6" stroke-width="1"/>
  <line x1="20"  y1="378" x2="738" y2="378" stroke="#dee2e6" stroke-width="1"/>
  <line x1="20"  y1="414" x2="738" y2="414" stroke="#dee2e6" stroke-width="1"/>
  <line x1="20"  y1="450" x2="738" y2="450" stroke="#dee2e6" stroke-width="1"/>

  <!-- Row 1: Memory per node -->
  <text x="105" y="364" text-anchor="middle" class="trade-key">Memory per node</text>
  <text x="200" y="357" class="trade-val">data + next</text>
  <text x="200" y="371" class="sub">(2 fields)</text>
  <text x="472" y="357" class="trade-val">data + next + prev</text>
  <text x="472" y="371" class="sub">(3 fields — one extra pointer per node)</text>

  <!-- Row 2: Traversal -->
  <text x="105" y="400" text-anchor="middle" class="trade-key">Traversal</text>
  <text x="200" y="400" class="trade-val">forward only  (head &#x2192; tail)</text>
  <text x="472" y="400" class="trade-val">forward + backward  (head &#x2194; tail)</text>

  <!-- Row 3: Pointer updates per op -->
  <text x="105" y="427" text-anchor="middle" class="trade-key">Pointer updates</text>
  <text x="105" y="441" text-anchor="middle" class="trade-key">per operation</text>
  <text x="200" y="427" class="trade-val">up to 2  (head_ or next)</text>
  <text x="200" y="441" class="sub">simpler to implement correctly</text>
  <text x="472" y="427" class="trade-val">up to 4  (next, prev, head_, tail_)</text>
  <text x="472" y="441" class="sub">more updates — more ways to make a mistake</text>

  <!-- Row 4: Best for -->
  <text x="105" y="472" text-anchor="middle" class="trade-key">Best for</text>
  <text x="200" y="472" class="trade-val">stacks, forward-only queues, low memory</text>
  <text x="472" y="472" class="trade-val">O(1) at both ends — deques, undo/redo, history</text>

</svg>
