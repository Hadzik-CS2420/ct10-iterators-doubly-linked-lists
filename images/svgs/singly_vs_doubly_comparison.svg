<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 495" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="100%" height="100%" fill="white"/>

  <!-- Title -->
  <text x="380" y="26" text-anchor="middle" font-size="18px" font-weight="bold" fill="#1a1a1a">Singly vs. Doubly Linked List: Trade-offs</text>

  <!-- ================================================================ -->
  <!-- BIG O TABLE                                                       -->
  <!-- ================================================================ -->

  <text x="20" y="46" font-size="12px" font-weight="bold" fill="#888">OPERATION COMPLEXITY</text>

  <!-- Header -->
  <rect x="20" y="52" width="718" height="28" rx="3" fill="#2c3e50"/>
  <text x="105" y="71" text-anchor="middle" font-size="13px" font-weight="bold" fill="#fff">Operation</text>
  <text x="326" y="71" text-anchor="middle" font-size="13px" font-weight="bold" fill="#fff">Singly Linked List</text>
  <text x="599" y="71" text-anchor="middle" font-size="13px" font-weight="bold" fill="#fff">Doubly Linked List</text>

  <!-- Row fills -->
  <rect x="20"  y="80"  width="718" height="34" fill="#f8f9fa"/>
  <rect x="20"  y="114" width="718" height="34" fill="white"/>
  <rect x="20"  y="148" width="718" height="34" fill="#f8f9fa"/>
  <rect x="20"  y="182" width="718" height="34" fill="white"/>
  <rect x="20"  y="216" width="718" height="34" fill="#f8f9fa"/>
  <rect x="20"  y="250" width="718" height="34" fill="white"/>

  <!-- Table border + column dividers + row dividers -->
  <rect x="20" y="52" width="718" height="232" rx="3" fill="none" stroke="#dee2e6" stroke-width="1.5"/>
  <line x1="190" y1="52"  x2="190" y2="284" stroke="#dee2e6" stroke-width="1"/>
  <line x1="462" y1="52"  x2="462" y2="284" stroke="#dee2e6" stroke-width="1"/>
  <line x1="20"  y1="80"  x2="738" y2="80"  stroke="#dee2e6" stroke-width="1"/>
  <line x1="20"  y1="114" x2="738" y2="114" stroke="#dee2e6" stroke-width="1"/>
  <line x1="20"  y1="148" x2="738" y2="148" stroke="#dee2e6" stroke-width="1"/>
  <line x1="20"  y1="182" x2="738" y2="182" stroke="#dee2e6" stroke-width="1"/>
  <line x1="20"  y1="216" x2="738" y2="216" stroke="#dee2e6" stroke-width="1"/>
  <line x1="20"  y1="250" x2="738" y2="250" stroke="#dee2e6" stroke-width="1"/>

  <!-- Row 1: push_front -->
  <text x="105" y="101" text-anchor="middle" font-size="12px" font-weight="bold" fill="#2c3e50" font-family="'Consolas', monospace">push_front()</text>
  <rect x="200" y="88"  width="40" height="18" rx="9" fill="#27ae60"/>
  <text x="220" y="101" text-anchor="middle" font-size="11px" font-weight="bold" fill="#fff">O(1)</text>
  <text x="248" y="101" font-size="11px" fill="#555">head_ points directly to the front</text>
  <rect x="472" y="88"  width="40" height="18" rx="9" fill="#27ae60"/>
  <text x="492" y="101" text-anchor="middle" font-size="11px" font-weight="bold" fill="#fff">O(1)</text>
  <text x="520" y="101" font-size="11px" fill="#555">same — head_ points directly to the front</text>

  <!-- Row 2: push_back -->
  <text x="105" y="135" text-anchor="middle" font-size="12px" font-weight="bold" fill="#2c3e50" font-family="'Consolas', monospace">push_back()</text>
  <rect x="200" y="122" width="40" height="18" rx="9" fill="#c0392b"/>
  <text x="220" y="135" text-anchor="middle" font-size="11px" font-weight="bold" fill="#fff">O(n)</text>
  <text x="248" y="135" font-size="11px" fill="#555">must walk the entire list to find the tail</text>
  <rect x="472" y="122" width="40" height="18" rx="9" fill="#27ae60"/>
  <text x="492" y="135" text-anchor="middle" font-size="11px" font-weight="bold" fill="#fff">O(1)</text>
  <text x="520" y="135" font-size="11px" fill="#555">tail_ points directly to the back</text>

  <!-- Row 3: pop_front -->
  <text x="105" y="169" text-anchor="middle" font-size="12px" font-weight="bold" fill="#2c3e50" font-family="'Consolas', monospace">pop_front()</text>
  <rect x="200" y="156" width="40" height="18" rx="9" fill="#27ae60"/>
  <text x="220" y="169" text-anchor="middle" font-size="11px" font-weight="bold" fill="#fff">O(1)</text>
  <text x="248" y="169" font-size="11px" fill="#555">head_ points directly to the front</text>
  <rect x="472" y="156" width="40" height="18" rx="9" fill="#27ae60"/>
  <text x="492" y="169" text-anchor="middle" font-size="11px" font-weight="bold" fill="#fff">O(1)</text>
  <text x="520" y="169" font-size="11px" fill="#555">same — head_ points directly to the front</text>

  <!-- Row 4: pop_back -->
  <text x="105" y="203" text-anchor="middle" font-size="12px" font-weight="bold" fill="#2c3e50" font-family="'Consolas', monospace">pop_back()</text>
  <rect x="200" y="190" width="40" height="18" rx="9" fill="#c0392b"/>
  <text x="220" y="203" text-anchor="middle" font-size="11px" font-weight="bold" fill="#fff">O(n)</text>
  <text x="248" y="203" font-size="11px" fill="#555">trailing pointer to find second-to-last</text>
  <rect x="472" y="190" width="40" height="18" rx="9" fill="#27ae60"/>
  <text x="492" y="203" text-anchor="middle" font-size="11px" font-weight="bold" fill="#fff">O(1)</text>
  <text x="520" y="203" font-size="11px" fill="#555">tail_-&gt;prev reaches second-to-last directly</text>

  <!-- Row 5: contains -->
  <text x="105" y="237" text-anchor="middle" font-size="12px" font-weight="bold" fill="#2c3e50" font-family="'Consolas', monospace">contains()</text>
  <rect x="200" y="224" width="40" height="18" rx="9" fill="#c0392b"/>
  <text x="220" y="237" text-anchor="middle" font-size="11px" font-weight="bold" fill="#fff">O(n)</text>
  <text x="248" y="237" font-size="11px" fill="#555">must scan from head to find value</text>
  <rect x="472" y="224" width="40" height="18" rx="9" fill="#c0392b"/>
  <text x="492" y="237" text-anchor="middle" font-size="11px" font-weight="bold" fill="#fff">O(n)</text>
  <text x="520" y="237" font-size="11px" fill="#555">same — no index, must scan the list</text>

  <!-- Row 6: remove -->
  <text x="105" y="271" text-anchor="middle" font-size="12px" font-weight="bold" fill="#2c3e50" font-family="'Consolas', monospace">remove()</text>
  <rect x="200" y="258" width="40" height="18" rx="9" fill="#c0392b"/>
  <text x="220" y="271" text-anchor="middle" font-size="11px" font-weight="bold" fill="#fff">O(n)</text>
  <text x="248" y="271" font-size="11px" fill="#555">trailing pointer to find and unlink node</text>
  <rect x="472" y="258" width="40" height="18" rx="9" fill="#c0392b"/>
  <text x="492" y="271" text-anchor="middle" font-size="11px" font-weight="bold" fill="#fff">O(n)</text>
  <text x="520" y="271" font-size="11px" fill="#555">same — must still scan to find the value</text>

  <!-- ================================================================ -->
  <!-- TRADE-OFFS TABLE                                                  -->
  <!-- ================================================================ -->

  <text x="20" y="308" font-size="12px" font-weight="bold" fill="#888">MEMORY &amp; DESIGN TRADE-OFFS</text>

  <!-- Header -->
  <rect x="20" y="314" width="718" height="28" rx="3" fill="#2c3e50"/>
  <text x="105" y="333" text-anchor="middle" font-size="13px" font-weight="bold" fill="#fff">Category</text>
  <text x="326" y="333" text-anchor="middle" font-size="13px" font-weight="bold" fill="#fff">Singly Linked List</text>
  <text x="599" y="333" text-anchor="middle" font-size="13px" font-weight="bold" fill="#fff">Doubly Linked List</text>

  <!-- Row fills -->
  <rect x="20"  y="342" width="718" height="36" fill="#f8f9fa"/>
  <rect x="20"  y="378" width="718" height="36" fill="white"/>
  <rect x="20"  y="414" width="718" height="36" fill="#f8f9fa"/>
  <rect x="20"  y="450" width="718" height="36" fill="white"/>

  <!-- Table border + dividers -->
  <rect x="20" y="314" width="718" height="172" rx="3" fill="none" stroke="#dee2e6" stroke-width="1.5"/>
  <line x1="190" y1="314" x2="190" y2="486" stroke="#dee2e6" stroke-width="1"/>
  <line x1="462" y1="314" x2="462" y2="486" stroke="#dee2e6" stroke-width="1"/>
  <line x1="20"  y1="342" x2="738" y2="342" stroke="#dee2e6" stroke-width="1"/>
  <line x1="20"  y1="378" x2="738" y2="378" stroke="#dee2e6" stroke-width="1"/>
  <line x1="20"  y1="414" x2="738" y2="414" stroke="#dee2e6" stroke-width="1"/>
  <line x1="20"  y1="450" x2="738" y2="450" stroke="#dee2e6" stroke-width="1"/>

  <!-- Row 1: Memory per node -->
  <text x="105" y="364" text-anchor="middle" font-size="12px" font-weight="bold" fill="#2c3e50">Memory per node</text>
  <text x="200" y="357" font-size="11px" fill="#444">data + next</text>
  <text x="200" y="371" font-size="10px" fill="#888">(2 fields)</text>
  <text x="472" y="357" font-size="11px" fill="#444">data + next + prev</text>
  <text x="472" y="371" font-size="10px" fill="#888">(3 fields — one extra pointer per node)</text>

  <!-- Row 2: Traversal -->
  <text x="105" y="400" text-anchor="middle" font-size="12px" font-weight="bold" fill="#2c3e50">Traversal</text>
  <text x="200" y="400" font-size="11px" fill="#444">forward only  (head &#x2192; tail)</text>
  <text x="472" y="400" font-size="11px" fill="#444">forward + backward  (head &#x2194; tail)</text>

  <!-- Row 3: Pointer updates per op -->
  <text x="105" y="427" text-anchor="middle" font-size="12px" font-weight="bold" fill="#2c3e50">Pointer updates</text>
  <text x="105" y="441" text-anchor="middle" font-size="12px" font-weight="bold" fill="#2c3e50">per operation</text>
  <text x="200" y="427" font-size="11px" fill="#444">up to 2  (head_ or next)</text>
  <text x="200" y="441" font-size="10px" fill="#888">simpler to implement correctly</text>
  <text x="472" y="427" font-size="11px" fill="#444">up to 4  (next, prev, head_, tail_)</text>
  <text x="472" y="441" font-size="10px" fill="#888">more updates — more ways to make a mistake</text>

  <!-- Row 4: Best for -->
  <text x="105" y="472" text-anchor="middle" font-size="12px" font-weight="bold" fill="#2c3e50">Best for</text>
  <text x="200" y="472" font-size="11px" fill="#444">stacks, forward-only queues, low memory</text>
  <text x="472" y="472" font-size="11px" fill="#444">O(1) at both ends — deques, undo/redo, history</text>

</svg>
